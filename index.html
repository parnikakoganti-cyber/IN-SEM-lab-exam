<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 25px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 90%;
        }

        button {
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #4f46e5;
            color: white;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage Student Details</p>
</header>

<div class="container">

    <h2>Student Registration</h2>

    <form>
        <input type="text" placeholder="Student Name" required>
        <br>

        <input type="text" placeholder="Student ID" required>
        <br>

        <input type="email" placeholder="Email" required>
        <br>

        <input type="text" placeholder="Course" required>
        <br>

        <button type="submit">Register Student</button>
    </form>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>rahul@gmail.com</td>
            <td>CSE</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>priya@gmail.com</td>
            <td>CSE</td>
        </tr>
    </table>

</div>

<footer>
    © 2026 Student Management System
</footer>

</body>
</html>
